<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نيراس - مساعدك الذكي</title>

<style>
body {
    font-family: sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
    direction: rtl;
}
.chat-box {
    height: 70vh;
    overflow-y: auto;
    padding: 10px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 0 5px #ccc;
}
.input-area {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}
#userInput {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}
#sendBtn {
    padding: 10px 20px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
.user-msg {
    background: #d1e7ff;
    padding: 8px;
    margin: 5px 0;
    border-radius: 8px;
    text-align: right;
}
.bot-msg {
    background: #e8e8e8;
    padding: 8px;
    margin: 5px 0;
    border-radius: 8px;
    text-align: left;
}
</style>
</head>

<body>

<h2>نيراس - مساعدك الذكي ✨</h2>

<div id="chatBox" class="chat-box"></div>

<div class="input-area">
    <input id="userInput" type="text" placeholder="اكتب رسالتك هنا">
    <button id="sendBtn">إرسال</button>
</div>

<script>
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const chatBox = document.getElementById("chatBox");

sendBtn.onclick = function () {
    const message = input.value.trim();
    if (!message) return;

    addMessage("user", message);
    input.value = "";

    fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message })
    })
    .then(res => res.json())
    .then(data => {
        if (data.response) {
            addMessage("bot", data.response);
        } else {
            addMessage("bot", "خطأ في السيرفر.");
        }
    })
    .catch(() => {
        addMessage("bot", "تعذر الاتصال بالسيرفر.");
    });
};

function addMessage(sender, text) {
    const div = document.createElement("div");
    div.className = sender === "user" ? "user-msg" : "bot-msg";
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
