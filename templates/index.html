<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>نيراس - مساعدك الذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #eef2f7; height: 100dvh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 0; overflow: hidden; }
        .app-container { width: 100%; max-width: 480px; height: 100dvh; background: #ffffff; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }

        .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px 12px 18px; border-bottom: 1px solid #f0f3f8; flex-shrink: 0; background: #ffffff; z-index: 10; }
        .chat-header .logo-icon { font-size: 26px; color: #4f7df3; }
        .chat-header .menu-btn { background: none; border: none; color: #4f5e7a; font-size: 22px; cursor: pointer; padding: 6px 10px; border-radius: 12px; transition: 0.2s; }
        .chat-header .menu-btn:hover { background: #eef2f7; }

        .dropdown-menu { position: absolute; top: 70px; left: 18px; right: 18px; background: #ffffff; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); padding: 12px 0; display: none; flex-direction: column; z-index: 999; border: 1px solid #eef2f7; max-height: 70vh; overflow-y: auto; }
        .dropdown-menu.show { display: flex; }
        .dropdown-menu .menu-item { display: flex; align-items: center; gap: 14px; padding: 14px 20px; font-size: 16px; color: #1a2b4a; border: none; background: none; width: 100%; text-align: right; cursor: pointer; transition: 0.15s; border-bottom: 1px solid #f5f8fc; }
        .dropdown-menu .menu-item:last-child { border-bottom: none; }
        .dropdown-menu .menu-item i { width: 24px; font-size: 20px; color: #4f7df3; }
        .dropdown-menu .menu-item:hover { background: #f5f8ff; }

        #chat-box { flex: 1; overflow-y: auto; padding: 14px 18px 10px 18px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .message { max-width: 85%; padding: 10px 16px; border-radius: 20px; line-height: 1.6; font-size: 15px; animation: fadeIn 0.25s ease; word-wrap: break-word; }
        .message.user { align-self: flex-end; background: #4f7df3; color: white; border-bottom-left-radius: 6px; }
        .message.bot { align-self: flex-start; background: #f1f4f9; color: #1a2b4a; border-bottom-right-radius: 6px; }
        .message .time { font-size: 9px; opacity: 0.4; margin-top: 4px; display: block; }
        .message.error-msg { background: #ffe5e5; color: #b33; align-self: center; max-width: 90%; }
        .message.system { background: #e8f0fe; color: #1a3a6b; align-self: center; max-width: 95%; font-size: 14px; border-radius: 16px; text-align: center; }

        .gallery { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
        .gallery img { width: 70px; height: 70px; object-fit: cover; border-radius: 12px; border: 1px solid #ddd; }
        .gallery .img-wrapper { position: relative; display: inline-block; }
        .gallery .img-wrapper .delete-btn { position: absolute; top: -6px; left: -6px; background: #d34a4a; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .gallery .img-wrapper .delete-btn:hover { background: #b33; }

        .input-area { display: flex; align-items: center; gap: 8px; background: #f5f8fc; border-radius: 50px; padding: 4px 4px 4px 16px; margin: 8px 16px 16px 16px; border: 1px solid #e6ecf5; transition: 0.3s; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .input-area:focus-within { border-color: #4f7df3; box-shadow: 0 2px 14px rgba(79,125,243,0.10); }
        .input-left { display: flex; align-items: center; gap: 2px; }
        .input-left button { background: none; border: none; color: #8a9bb5; font-size: 20px; cursor: pointer; padding: 6px; border-radius: 50%; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; }
        .input-left button:hover { background: #e6edf6; color: #1a2b4a; }
        .input-left button.mic-btn { color: #4f7df3; }
        .input-left button.mic-btn:hover { background: #dfe8fd; }
        .input-area input { flex: 1; border: none; background: transparent; padding: 12px 4px; font-size: 16px; outline: none; color: #1a2b4a; min-width: 0; direction: rtl; }
        .input-area input::placeholder { color: #b0c0d4; font-size: 15px; }
        .input-area .send-btn { background: #4f7df3; border: none; color: white; width: 46px; height: 46px; border-radius: 50%; font-size: 20px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 14px rgba(79,125,243,0.30); }
        .input-area .send-btn:hover { background: #3b66d9; transform: scale(1.02); }
        .input-area .send-btn:active { transform: scale(0.92); }

        @media (max-width: 420px) {
            .chat-header { padding: 12px 14px 10px 14px; }
            .chat-header .logo-icon { font-size: 22px; }
            .dropdown-menu { top: 60px; left: 12px; right: 12px; }
            .dropdown-menu .menu-item { padding: 12px 16px; font-size: 15px; }
            #chat-box { padding: 10px 12px 8px 12px; }
            .message { font-size: 14px; padding: 8px 12px; }
            .input-area { margin: 6px 12px 12px 12px; }
            .input-area input { font-size: 15px; padding: 10px 4px; }
            .input-area .send-btn { width: 40px; height: 40px; font-size: 18px; }
            .input-left button { width: 34px; height: 34px; font-size: 18px; }
        }
    </style>
</head>
<body>
<div class="app-container">

    <div class="chat-header">
        <div class="logo-icon"><i class="fas fa-brain"></i></div>
        <button class="menu-btn" id="menuToggle"><i class="fas fa-ellipsis-v"></i></button>
    </div>

    <!-- القائمة المنسدلة (بدون رئيسية، مع محادثة جديدة) -->
    <div class="dropdown-menu" id="dropdownMenu">
        <button class="menu-item" data-action="newchat"><i class="fas fa-plus-circle"></i> محادثة جديدة</button>
        <button class="menu-item" data-action="library"><i class="fas fa-layer-group"></i> المكتبة (صوري)</button>
        <button class="menu-item" data-action="history"><i class="fas fa-history"></i> المحادثات السابقة</button>
    </div>

    <div id="chat-box"></div>

    <div class="input-area">
        <div class="input-left">
            <button class="mic-btn" id="micBtn"><i class="fas fa-microphone"></i></button>
            <button id="fileBtn"><i class="fas fa-image"></i></button>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" />
        </div>
        <input type="text" id="user-input" placeholder="اكتب رسالتك..." autofocus />
        <button class="send-btn" id="sendBtn"><i class="fas fa-arrow-left"></i></button>
    </div>
</div>

<script>
    (function() {
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const fileBtn = document.getElementById('fileBtn');
        const fileInput = document.getElementById('fileInput');
        const menuToggle = document.getElementById('menuToggle');
        const dropdown = document.getElementById('dropdownMenu');
        let isMenuOpen = false;

        // === إضافة رسالة ===
        function addMessage(text, sender = 'bot', isSystem = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}${isSystem ? ' system' : ''}`;
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
            msgDiv.innerHTML = `${text} <span class="time">${timeStr}</span>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            saveChatToHistory(sender, text);
        }

        // === حفظ واسترجاع المحادثات ===
        function saveChatToHistory(sender, text) {
            let history = JSON.parse(localStorage.getItem('niras_chat_history') || '[]');
            history.push({ sender, text, time: new Date().toISOString() });
            if (history.length > 50) history = history.slice(-50);
            localStorage.setItem('niras_chat_history', JSON.stringify(history));
        }
        function getChatHistory() {
            return JSON.parse(localStorage.getItem('niras_chat_history') || '[]');
        }

        // === حفظ واسترجاع الصور ===
        function getImages() {
            return JSON.parse(localStorage.getItem('niras_images') || '[]');
        }
        function saveImages(images) {
            localStorage.setItem('niras_images', JSON.stringify(images));
        }
        function deleteImage(index) {
            let images = getImages();
            if (index >= 0 && index < images.length) {
                images.splice(index, 1);
                saveImages(images);
                addMessage('🗑️ تم حذف الصورة.', 'bot', true);
                showLibrary();
            }
        }

        // === عرض المكتبة ===
        function showLibrary() {
            const images = getImages();
            if (!images || images.length === 0) {
                addMessage('📭 لا توجد صور في مكتبتك. ارفع صورة باستخدام زر 📎.', 'bot', true);
                return;
            }
            let html = '<div class="gallery">';
            images.forEach((imgData, index) => {
                html += `<div class="img-wrapper">
                    <img src="${imgData}" />
                    <button class="delete-btn" data-index="${index}">✕</button>
                </div>`;
            });
            html += '</div>';
            const container = document.createElement('div');
            container.className = 'message bot system';
            container.innerHTML = html + `<span class="time">${new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })}</span>`;
            chatBox.appendChild(container);
            chatBox.scrollTop = chatBox.scrollHeight;
            container.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.index);
                    deleteImage(idx);
                });
            });
        }

        // === عرض المحادثات السابقة ===
        function showHistory() {
            const history = getChatHistory();
            if (history.length === 0) {
                addMessage('📭 لا توجد محادثات سابقة.', 'bot', true);
                return;
            }
            let msg = '📜 **آخر المحادثات**\n';
            history.slice(-8).forEach((entry, idx) => {
                const time = new Date(entry.time).toLocaleString('ar-SA', { hour: '2-digit', minute: '2-digit' });
                msg += `${idx+1}. ${entry.sender === 'user' ? '👤' : '🤖'} ${entry.text.substring(0, 35)}... (${time})\n`;
            });
            addMessage(msg, 'bot', true);
            history.slice(-5).forEach((entry) => {
                const btn = document.createElement('button');
                btn.textContent = `↻ ${entry.text.substring(0, 25)}`;
                btn.style.cssText = 'background: #eef2f7; border: none; border-radius: 20px; padding: 6px 14px; margin: 4px; cursor: pointer; font-size: 13px;';
                btn.onclick = function() { userInput.value = entry.text; userInput.focus(); };
                chatBox.appendChild(btn);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // === محادثة جديدة (مسح الشات + رسالة ترحيب) ===
        function startNewChat() {
            chatBox.innerHTML = ''; // مسح المحتوى
            addMessage('🔄 بدأت محادثة جديدة. اسألني أي شيء.', 'bot', true);
        }

        // === معالجة خيارات القائمة ===
        function handleAction(action) {
            switch(action) {
                case 'newchat': startNewChat(); break;
                case 'library': showLibrary(); break;
                case 'history': showHistory(); break;
                default: break;
            }
        }

        // === ربط أزرار القائمة ===
        document.querySelectorAll('.dropdown-menu .menu-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                dropdown.classList.remove('show');
                isMenuOpen = false;
                handleAction(item.dataset.action);
            });
        });

        menuToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            isMenuOpen = !isMenuOpen;
            dropdown.classList.toggle('show', isMenuOpen);
        });
        document.addEventListener('click', (e) => {
            if (!menuToggle.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.remove('show');
                isMenuOpen = false;
            }
        });

        // === إرسال الرسالة ===
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            addMessage(message, 'user');
            userInput.value = '';
            userInput.focus();
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                if (res.ok) addMessage(data.response, 'bot');
                else addMessage(`⚠️ ${data.error || 'خطأ'}`, 'bot error-msg');
            } catch (e) {
                addMessage('⚠️ تعذر الاتصال بالسيرفر.', 'bot error-msg');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        // === المايك ===
        micBtn.addEventListener('click', () => {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                addMessage('🎙️ جاري الاستماع...', 'bot', true);
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'ar-SA';
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    userInput.value = transcript;
                    addMessage(`🎤 سمعت: "${transcript}"`, 'bot', true);
                    setTimeout(sendMessage, 300);
                };
                recognition.onerror = () => addMessage('⚠️ لم يُسمع صوت، حاول مرة أخرى.', 'bot', true);
                recognition.start();
            } else {
                addMessage('⚠️ متصفحك لا يدعم الصوت.', 'bot', true);
            }
        });

        // === رفع الصور ===
        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (fileInput.files && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    let images = getImages();
                    images.push(ev.target.result);
                    saveImages(images);
                    addMessage(`📎 تم رفع: ${file.name}`, 'user');
                    addMessage('✅ حفظت في مكتبتك.', 'bot', true);
                    fileInput.value = '';
                };
                reader.readAsDataURL(file);
            }
        });

        // === ترحيب أولي ===
        if (!localStorage.getItem('niras_welcomed')) {
            setTimeout(() => {
                addMessage('👋 مرحباً! أنا نيراس. اسألني أي شيء، أو استخدم القائمة ☰ للمكتبة والمحادثات السابقة.', 'bot', true);
                localStorage.setItem('niras_welcomed', 'true');
            }, 300);
        } else {
            setTimeout(() => addMessage('👋 أهلاً بك مجدداً!', 'bot', true), 300);
        }
    })();
</script>
</body>
</html>
