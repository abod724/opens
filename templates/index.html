<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>نيراس - مساعدك الذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: #eef2f7;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* ===== الهيدر (بدون اسم نيراس، بس أيقونة) ===== */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px 12px 18px;
            border-bottom: 1px solid #f0f3f8;
            flex-shrink: 0;
            background: #ffffff;
            z-index: 10;
        }
        .chat-header .logo-icon {
            font-size: 26px;
            color: #4f7df3;
        }
        .chat-header .menu-btn {
            background: none;
            border: none;
            color: #4f5e7a;
            font-size: 22px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 12px;
            transition: 0.2s;
        }
        .chat-header .menu-btn:hover {
            background: #eef2f7;
        }

        /* ===== القائمة المنسدلة ===== */
        .dropdown-menu {
            position: absolute;
            top: 70px;
            left: 18px;
            right: 18px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            padding: 12px 0;
            display: none;
            flex-direction: column;
            z-index: 999;
            border: 1px solid #eef2f7;
            backdrop-filter: blur(4px);
            max-height: 70vh;
            overflow-y: auto;
        }
        .dropdown-menu.show {
            display: flex;
        }
        .dropdown-menu .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            font-size: 16px;
            color: #1a2b4a;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
            cursor: pointer;
            transition: 0.15s;
            border-bottom: 1px solid #f5f8fc;
        }
        .dropdown-menu .menu-item:last-child {
            border-bottom: none;
        }
        .dropdown-menu .menu-item i {
            width: 24px;
            font-size: 20px;
            color: #4f7df3;
        }
        .dropdown-menu .menu-item:hover {
            background: #f5f8ff;
        }
        .dropdown-menu .menu-item.danger {
            color: #d34a4a;
        }
        .dropdown-menu .menu-item.danger i {
            color: #d34a4a;
        }

        /* ===== صندوق المحادثات ===== */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px 10px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .message {
            max-width: 85%;
            padding: 10px 16px;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 15px;
            animation: fadeIn 0.25s ease;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #4f7df3;
            color: white;
            border-bottom-left-radius: 6px;
        }
        .message.bot {
            align-self: flex-start;
            background: #f1f4f9;
            color: #1a2b4a;
            border-bottom-right-radius: 6px;
        }
        .message .time {
            font-size: 9px;
            opacity: 0.4;
            margin-top: 4px;
            display: block;
        }
        .message.error-msg {
            background: #ffe5e5;
            color: #b33;
            align-self: center;
            max-width: 90%;
        }
        .message.system {
            background: #e8f0fe;
            color: #1a3a6b;
            align-self: center;
            max-width: 95%;
            font-size: 14px;
            border-radius: 16px;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== منطقة الإدخال ===== */
        .input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f5f8fc;
            border-radius: 50px;
            padding: 4px 4px 4px 16px;
            margin: 8px 16px 16px 16px;
            border: 1px solid #e6ecf5;
            transition: 0.3s;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .input-area:focus-within {
            border-color: #4f7df3;
            box-shadow: 0 2px 14px rgba(79,125,243,0.10);
        }
        .input-left {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .input-left button {
            background: none;
            border: none;
            color: #8a9bb5;
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
        }
        .input-left button:hover {
            background: #e6edf6;
            color: #1a2b4a;
        }
        .input-left button.mic-btn {
            color: #4f7df3;
        }
        .input-left button.mic-btn:hover {
            background: #dfe8fd;
        }
        .input-area input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 4px;
            font-size: 16px;
            outline: none;
            color: #1a2b4a;
            min-width: 0;
            direction: rtl;
        }
        .input-area input::placeholder {
            color: #b0c0d4;
            font-size: 15px;
        }
        .input-area .send-btn {
            background: #4f7df3;
            border: none;
            color: white;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(79,125,243,0.30);
        }
        .input-area .send-btn:hover {
            background: #3b66d9;
            transform: scale(1.02);
        }
        .input-area .send-btn:active {
            transform: scale(0.92);
        }

        @media (max-width: 420px) {
            .chat-header { padding: 12px 14px 10px 14px; }
            .chat-header .logo-icon { font-size: 22px; }
            .dropdown-menu { top: 60px; left: 12px; right: 12px; }
            .dropdown-menu .menu-item { padding: 12px 16px; font-size: 15px; }
            #chat-box { padding: 10px 12px 8px 12px; }
            .message { font-size: 14px; padding: 8px 12px; }
            .input-area { margin: 6px 12px 12px 12px; }
            .input-area input { font-size: 15px; padding: 10px 4px; }
            .input-area .send-btn { width: 40px; height: 40px; font-size: 18px; }
            .input-left button { width: 34px; height: 34px; font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- ===== الهيدر (تم إزالة النص نهائياً) ===== -->
    <div class="chat-header">
        <div class="logo-icon"><i class="fas fa-brain"></i></div>
        <button class="menu-btn" id="menuToggle" aria-label="القائمة">
            <i class="fas fa-ellipsis-v"></i>
        </button>
    </div>

    <!-- ===== القائمة المنسدلة ===== -->
    <div class="dropdown-menu" id="dropdownMenu">
        <button class="menu-item" data-action="home"><i class="fas fa-home"></i> الرئيسية</button>
        <button class="menu-item" data-action="library"><i class="fas fa-layer-group"></i> المكتبة (تخزين الصور)</button>
        <button class="menu-item" data-action="search"><i class="fas fa-search"></i> بحث</button>
        <button class="menu-item" data-action="history"><i class="fas fa-history"></i> المحادثات السابقة</button>
        <button class="menu-item" data-action="settings"><i class="fas fa-cog"></i> الإعدادات</button>
        <button class="menu-item danger" data-action="logout"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
    </div>

    <!-- ===== صندوق المحادثة ===== -->
    <div id="chat-box">
        <!-- تظهر الرسائل هنا، بدون رسائل ترحيبية -->
    </div>

    <!-- ===== منطقة الإدخال ===== -->
    <div class="input-area">
        <div class="input-left">
            <button class="mic-btn" id="micBtn" title="إرسال صوتي"><i class="fas fa-microphone"></i></button>
            <button id="fileBtn" title="رفع صورة"><i class="fas fa-image"></i></button>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" />
        </div>
        <input type="text" id="user-input" placeholder="اكتب رسالتك..." autofocus />
        <button class="send-btn" id="sendBtn"><i class="fas fa-arrow-left"></i></button>
    </div>
</div>

<script>
    (function() {
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const fileBtn = document.getElementById('fileBtn');
        const fileInput = document.getElementById('fileInput');
        const menuToggle = document.getElementById('menuToggle');
        const dropdown = document.getElementById('dropdownMenu');
        let isMenuOpen = false;

        function addMessage(text, sender = 'bot', isSystem = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}${isSystem ? ' system' : ''}`;
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
            msgDiv.innerHTML = `${text} <span class="time">${timeStr}</span>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function toggleMenu() {
            isMenuOpen = !isMenuOpen;
            dropdown.classList.toggle('show', isMenuOpen);
        }

        document.addEventListener('click', function(e) {
            const target = e.target;
            if (!menuToggle.contains(target) && !dropdown.contains(target)) {
                dropdown.classList.remove('show');
                isMenuOpen = false;
            }
        });

        menuToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleMenu();
        });

        // ===== الخيارات الجديدة المعدلة =====
        document.querySelectorAll('.dropdown-menu .menu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const action = this.dataset.action;
                dropdown.classList.remove('show');
                isMenuOpen = false;

                switch(action) {
                    case 'home':
                        addMessage('🏠 أهلاً بك في الرئيسية.', 'bot', true);
                        break;
                    case 'library':
                        addMessage('📚 **المكتبة**\nهنا سيتم تخزين صورك وملفاتك.\nيمكنك لاحقاً تحميلها أو تعديلها أو الرجوع لها.', 'bot', true);
                        break;
                    case 'search':
                        addMessage('🔍 **بحث**\nاكتب كلمة البحث في مربع الكتابة بالأسفل وسأبحث لك.', 'bot', true);
                        break;
                    case 'history':
                        addMessage('📜 **المحادثات السابقة**\n1. اليوم 10:46 ص\n2. الأمس - موضوع التقنية\n3. الأسبوع الماضي', 'bot', true);
                        break;
                    case 'settings':
                        addMessage('⚙️ **الإعدادات**\n- اللغة: العربية\n- المظهر: فاتح\n- الإشعارات: مفعّلة', 'bot', true);
                        break;
                    case 'logout':
                        addMessage('🚪 جاري التوجيه لتسجيل الدخول عبر حساب Google...', 'bot', true);
                        break;
                    default:
                        break;
                }
            });
        });

        // === إرسال الرسالة ===
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            addMessage(message, 'user');
            userInput.value = '';
            userInput.focus();
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                if (res.ok) addMessage(data.response, 'bot');
                else addMessage(`⚠️ ${data.error || 'خطأ'}`, 'bot error-msg');
            } catch (e) {
                addMessage('⚠️ تعذر الاتصال بالسيرفر', 'bot error-msg');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        micBtn.addEventListener('click', () => addMessage('🎙️ ميزة الصوت قريباً', 'bot'));
        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                const file = this.files[0];
                addMessage(`📎 تم رفع: ${file.name}`, 'user');
                fileInput.value = '';
            }
        });

        // لا توجد رسالة ترحيب (تم إزالتها)
    })();
</script>
</body>
</html>
