<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>المساعد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        html, body { height: 100%; overflow: hidden; }
        body { background: #ffffff; margin: 0; padding: 0; }
        .app { width: 100%; height: 100vh; background: #ffffff; display: flex; flex-direction: column; position: relative; }

        .header { 
            position: sticky;
            top: 0;
            z-index: 999;
            display: flex; 
            justify-content: flex-end; 
            align-items: center; 
            padding: 16px 20px; 
            border-bottom: 1px solid #eaeef2; 
            background: #ffffff; 
        }
        .header .menu-btn { 
            background: none; 
            border: none; 
            font-size: 20px; 
            color: #2c3e50; 
            cursor: pointer; 
            padding: 8px; 
            font-weight: bold;
        }

        .dropdown { 
            position: absolute; 
            top: 65px; 
            left: 16px; 
            right: 16px; 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.12); 
            display: none; 
            flex-direction: column; 
            z-index: 1000; 
            border: 1px solid #eaedf2; 
        }
        .dropdown.show { display: flex; }
        .dropdown .item { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 14px 18px; 
            font-size: 15px; 
            color: #1a2b3c; 
            background: none; 
            border: none; 
            width: 100%; 
            text-align: right; 
            cursor: pointer; 
            border-bottom: 1px solid #f0f2f5; 
        }
        .dropdown .item:last-child { border-bottom: none; }
        .dropdown .item i { width: 22px; font-size: 18px; color: #5a6b7c; }
        .dropdown .item:hover { background: #f5f7fa; }

        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 16px 18px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            background: #ffffff; 
        }
        .msg { max-width: 80%; padding: 10px 16px; border-radius: 20px; font-size: 15px; line-height: 1.6; word-wrap: break-word; }
        .msg.user { align-self: flex-end; background: #eef2f7; color: #1a2b3c; border-bottom-left-radius: 6px; }
        .msg.bot { align-self: flex-start; background: #f5f7fa; color: #1a2b3c; border-bottom-right-radius: 6px; }
        .msg .time { font-size: 9px; opacity: 0.35; display: block; margin-top: 4px; }
        .msg.error { background: #fde8e8; color: #a33; align-self: center; max-width: 90%; }

        .msg .image-upload { max-width: 100%; max-height: 200px; border-radius: 12px; margin: 4px 0; border: 1px solid #ddd; display: block; }
        .msg .file-label { font-size: 12px; color: #6a7b8c; margin-top: 2px; display: block; }

        .gallery { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
        .gallery .img-wrap { position: relative; display: inline-block; }
        .gallery .img-wrap img { width: 68px; height: 68px; object-fit: cover; border-radius: 10px; border: 1px solid #ddd; }
        .gallery .img-wrap .del { position: absolute; top: -6px; left: -6px; background: #c33; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .input-area { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            padding: 8px 14px; 
            margin: 8px 14px 16px 14px; 
            background: #f5f7fa; 
            border-radius: 40px; 
            border: 1px solid #dce1e8; 
            flex-shrink: 0; 
            position: sticky;
            bottom: 0;
            z-index: 10;
        }
        .input-area input { flex: 1; border: none; background: transparent; padding: 12px 4px; font-size: 15px; outline: none; color: #1a2b3c; direction: rtl; }
        .input-area input::placeholder { color: #9aabbc; }
        .input-area .btn-icon { background: none; border: none; color: #6a7b8c; font-size: 20px; cursor: pointer; padding: 4px; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; }
        .input-area .btn-icon:hover { background: #e8ecf0; }
        .input-area .mic-btn { color: #4a6a8a; }
        .input-area .mic-btn.listening { color: #c33; background: #fde8e8; }
        .input-area .send { background: #4a6a8a; color: white; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 2px 8px rgba(74,106,138,0.2); }
        .input-area .send:hover { background: #3a5a7a; }

        @media (max-width: 420px) {
            .header { padding: 14px 16px; }
            .header .menu-btn { font-size: 24px; }
            .dropdown { top: 60px; left: 12px; right: 12px; }
            #chat { padding: 12px 14px; }
            .msg { font-size: 14px; padding: 8px 12px; }
            .input-area { margin: 6px 10px 12px 10px; padding: 6px 12px; }
            .input-area input { font-size: 14px; padding: 10px 2px; }
            .input-area .send { width: 40px; height: 40px; font-size: 16px; }
            .input-area .btn-icon { width: 34px; height: 34px; font-size: 18px; }
            .msg .image-upload { max-height: 150px; }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <button class="menu-btn" id="menuToggle"><i class="fas fa-ellipsis-v"></i></button>
    </div>

    <div class="dropdown" id="dropdown">
        <button class="item" data-action="new"><i class="fas fa-plus-circle"></i> محادثة جديدة</button>
        <button class="item" data-action="history"><i class="fas fa-history"></i> المحادثات السابقة</button>
    </div>

    <div id="chat"></div>

    <div class="input-area">
        <button class="btn-icon mic-btn" id="micBtn" title="تسجيل صوت"><i class="fas fa-microphone"></i></button>
        <button class="btn-icon" id="fileBtn" title="رفع صورة"><i class="fas fa-image"></i></button>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" />
        <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." autofocus />
        <button class="send" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    (function() {
        'use strict';

        const chatBox = document.getElementById('chat');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const fileBtn = document.getElementById('fileBtn');
        const fileInput = document.getElementById('fileInput');
        const menuToggle = document.getElementById('menuToggle');
        const dropdown = document.getElementById('dropdown');

        // ✅ دالة قراءة الرد بصوت عربي سعودي
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const kalam = new SpeechSynthesisUtterance(text);
                kalam.lang = 'ar-SA';
                kalam.rate = 0.9;
                kalam.pitch = 1;
                speechSynthesis.speak(kalam);
            }
        }

        function addMessage(text, sender = 'bot', isSystem = false, imageData = null) {
            const el = document.createElement('div');
            el.className = `msg ${sender}`;
            if (sender === 'error') el.classList.add('error');
            
            let content = '';
            if (imageData) {
                content = `<img src="${imageData}" class="image-upload" /><span class="file-label">${text || 'صورة'}</span>`;
            } else {
                content = text;
            }
            
            const now = new Date();
            const time = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
            el.innerHTML = `${content} <span class="time">${time}</span>`;
            chatBox.appendChild(el);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            if (!isSystem && sender !== 'error') {
                let historyText = text;
                if (imageData) historyText = '📷 رفع صورة: ' + (text || 'صورة');
                saveHistory(sender, historyText);
            }
        }

        function saveHistory(sender, text) {
            let hist = JSON.parse(localStorage.getItem('chat_history') || '[]');
            hist.push({ sender, text, time: new Date().toISOString() });
            if (hist.length > 100) hist = hist.slice(-100);
            localStorage.setItem('chat_history', JSON.stringify(hist));
        }
        function getHistory() {
            return JSON.parse(localStorage.getItem('chat_history') || '[]');
        }

        function showHistory() {
            const hist = getHistory();
            if (hist.length === 0) {
                addMessage('لا توجد محادثات سابقة.', 'bot', true);
                return;
            }
            addMessage('أحدث المحادثات:', 'bot', true);
            hist.slice(-6).forEach(entry => {
                const btn = document.createElement('button');
                btn.textContent = entry.text.length > 25 ? entry.text.substring(0, 25) + '…' : entry.text;
                btn.style.cssText = 'background:#f0f2f5;border:none;border-radius:30px;padding:6px 14px;margin:4px;cursor:pointer;font-size:13px;color:#1a2b3c;display:block;text-align:right;';
                btn.onclick = function() { userInput.value = entry.text; userInput.focus(); dropdown.classList.remove('show'); };
                chatBox.appendChild(btn);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function newChat() {
            chatBox.innerHTML = '';
            dropdown.classList.remove('show');
        }

        function handleAction(action) {
            dropdown.classList.remove('show');
            switch(action) {
                case 'new': newChat(); break;
                case 'history': showHistory(); break;
            }
        }

        document.querySelectorAll('.dropdown .item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                handleAction(item.dataset.action);
            });
        });

        menuToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('show');
        });
        document.addEventListener('click', () => {
            dropdown.classList.remove('show');
        });

        let recognition = null;
        micBtn.addEventListener('click', function() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                addMessage('المتصفح لا يدعم التعرف على الصوت.', 'bot', true);
                return;
            }
            if (this.classList.contains('listening')) {
                this.classList.remove('listening');
                if (recognition) recognition.stop();
                return;
            }
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SR();
            recognition.lang = 'ar-SA';
            recognition.continuous = false;
            recognition.interimResults = false;

            this.classList.add('listening');
            addMessage('جاري الاستماع...', 'bot', true);

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                micBtn.classList.remove('listening');
                setTimeout(() => sendMessage(), 300);
            };
            recognition.onerror = () => micBtn.classList.remove('listening');
            recognition.onend = () => micBtn.classList.remove('listening');
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            userInput.value = '';
            userInput.focus();
            
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                if (res.ok) {
                    const رد = data.response || 'تم استلام رسالتك.';
                    addMessage(رد, 'bot');
                    speakText(رد);
                } else {
                    addMessage(`خطأ: ${data.error || 'مشكلة في الاتصال'}`, 'error');
                }
            } catch {
                addMessage('تعذر الاتصال بالسيرفر.', 'error');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                const file = this.files[0];
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const imgData = ev.target.result;
                    addMessage(file.name, 'user', false, imgData);
                    addMessage('تم رفع الصورة.', 'bot', true);
                    fileInput.value = '';
                };
                reader.readAsDataURL(file);
            }
        });
    })();
</script>
</body>
</html>
