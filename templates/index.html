<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>نبراس – مساعدك الذكي</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --bg: #0f172a;
    --card: #111827;
    --accent: #3b82f6;
    --accent-soft: #1d4ed8;
    --text: #e5e7eb;
    --text-soft: #9ca3af;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #1f2937 0, #020617 55%);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    direction: rtl;
}
.app {
    width: 100%;
    max-width: 900px;
    padding: 20px;
}
.card {
    background: linear-gradient(145deg, #020617, #0b1120);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    border: 1px solid rgba(148,163,184,0.25);
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}
.title {
    font-size: 20px;
    font-weight: 600;
}
.subtitle {
    font-size: 13px;
    color: var(--text-soft);
}
.badge {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    background: rgba(37,99,235,0.15);
    border: 1px solid rgba(59,130,246,0.6);
    color: #bfdbfe;
}
.chat {
    height: 60vh;
    max-height: 520px;
    overflow-y: auto;
    padding: 10px;
    border-radius: 14px;
    background: radial-gradient(circle at top left, #020617 0, #020617 40%, #030712 100%);
    border: 1px solid rgba(55,65,81,0.7);
}
.msg {
    max-width: 80%;
    padding: 10px 12px;
    border-radius: 12px;
    margin: 6px 0;
    font-size: 14px;
    line-height: 1.5;
    position: relative;
}
.msg.user {
    margin-left: auto;
    background: linear-gradient(135deg, #1d4ed8, #3b82f6);
    color: #eff6ff;
}
.msg.bot {
    margin-right: auto;
    background: rgba(15,23,42,0.9);
    border: 1px solid rgba(75,85,99,0.8);
}
.msg .label {
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 4px;
}
.footer {
    margin-top: 12px;
    display: flex;
    gap: 10px;
}
.input-wrap {
    flex: 1;
    position: relative;
}
input[type="text"] {
    width: 100%;
    padding: 11px 40px 11px 12px;
    border-radius: 999px;
    border: 1px solid rgba(75,85,99,0.9);
    background: rgba(15,23,42,0.95);
    color: var(--text);
    font-size: 14px;
    outline: none;
}
input[type="text"]::placeholder {
    color: #6b7280;
}
.send-btn {
    width: 42px;
    height: 42px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 25px rgba(37,99,235,0.6);
}
.send-btn:disabled {
    opacity: 0.5;
    cursor: default;
    box-shadow: none;
}
.status {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--text-soft);
}
@media (max-width: 600px) {
    .card { padding: 14px; }
    .chat { height: 55vh; }
}
</style>
</head>
<body>

<div class="app">
    <div class="card">
        <div class="header">
            <div>
                <div class="title">نبراس – مساعدك الذكي</div>
                <div class="subtitle">اسأل، جرّب، ناقش… وردّك يجيك فورًا.</div>
            </div>
            <div class="badge">متصل بـ Flask</div>
        </div>

        <div id="chatBox" class="chat"></div>

        <div class="footer">
            <div class="input-wrap">
                <input id="userInput" type="text" placeholder="اكتب سؤالك أو طلبك هنا…">
                <span id="status" class="status"></span>
            </div>
            <button id="sendBtn" class="send-btn">
                ➤
            </button>
        </div>
    </div>
</div>

<script>
const input   = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const chatBox = document.getElementById("chatBox");
const status  = document.getElementById("status");

function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "bot");

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = role === "user" ? "أنت" : "نبراس";

    const content = document.createElement("div");
    content.textContent = text;

    div.appendChild(label);
    div.appendChild(content);
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function setStatus(text) {
    status.textContent = text || "";
}

sendBtn.onclick = async function () {
    const message = input.value.trim();
    if (!message) return;

    addMessage("user", message);
    input.value = "";
    setStatus("جارٍ الإرسال…");
    sendBtn.disabled = true;

    try {
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message })
        });

        const data = await res.json();

        if (data.response) {
            addMessage("bot", data.response);
            setStatus("");
        } else {
            addMessage("bot", "صار خطأ في السيرفر.");
            setStatus("خطأ في الاتصال");
        }
    } catch (e) {
        addMessage("bot", "تعذر الاتصال بالسيرفر حالياً.");
        setStatus("غير متصل");
    } finally {
        sendBtn.disabled = false;
    }
};

input.addEventListener("keydown", e => {
    if (e.key === "Enter") sendBtn.click();
});
</script>

</body>
</html>
