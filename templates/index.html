<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>نيراس - مساعدك الذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
        }

        body {
            background: #eef2f7;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
        }

        /* الحاوية - تناسب الجوال تماماً */
        .app-container {
            width: 100%;
            max-width: 480px;    /* حد أقصى عرض الجوال */
            height: 100vh;      /* يملأ الشاشة بالكامل */
            background: #ffffff;
            display: flex;
            overflow: hidden;
            position: relative;
            box-shadow: none;
            border-radius: 0;
        }

        /* ===== الشريط الجانبي (صغير جداً للجوال) ===== */
        .sidebar {
            width: 60px;
            background: #f8faff;
            padding: 16px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-left: 1px solid #eef2f7;
            flex-shrink: 0;
            height: 100%;
        }

        .sidebar .logo {
            font-size: 18px;
            font-weight: 700;
            color: #1a2b4a;
            margin-bottom: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .sidebar .logo i {
            color: #4f7df3;
            font-size: 24px;
        }
        .sidebar .logo span {
            font-size: 11px;
        }

        .sidebar .nav-icons {
            display: flex;
            flex-direction: column;
            gap: 22px;
            align-items: center;
            width: 100%;
        }
        .sidebar .nav-icons a {
            color: #8a9bb5;
            font-size: 18px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: 0.2s;
        }
        .sidebar .nav-icons a i {
            font-size: 20px;
        }
        .sidebar .nav-icons a span {
            font-size: 8px;
            opacity: 0.6;
        }
        .sidebar .nav-icons a.active {
            color: #4f7df3;
        }
        .sidebar .nav-icons a:hover {
            color: #1a2b4a;
        }

        .sidebar .bottom-icons {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding-bottom: 10px;
        }
        .sidebar .bottom-icons a {
            color: #8a9bb5;
            font-size: 18px;
            transition: 0.2s;
        }
        .sidebar .bottom-icons a:hover {
            color: #1a2b4a;
        }

        /* ===== المحتوى الرئيسي ===== */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            padding: 12px 14px 12px 14px;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* الهيدر */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f3f8;
            flex-shrink: 0;
        }
        .chat-header h2 {
            font-size: 17px;
            font-weight: 600;
            color: #1a2b4a;
        }
        .chat-header h2 i {
            color: #4f7df3;
            margin-left: 6px;
            font-size: 18px;
        }
        .chat-header .header-actions i {
            color: #8a9bb5;
            font-size: 16px;
            cursor: default;
        }

        /* ===== صندوق المحادثات ===== */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0 8px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 14px;
            animation: fadeIn 0.25s ease;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: #4f7df3;
            color: white;
            border-bottom-left-radius: 4px;
        }
        .message.bot {
            align-self: flex-start;
            background: #f1f4f9;
            color: #1a2b4a;
            border-bottom-right-radius: 4px;
        }
        .message .time {
            font-size: 9px;
            opacity: 0.4;
            margin-top: 4px;
            display: block;
        }
        .message.error-msg {
            background: #ffe5e5;
            color: #b33;
            align-self: center;
            max-width: 90%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== منطقة الإدخال (مضغوطة للجوال) ===== */
        .input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f5f8fc;
            border-radius: 50px;
            padding: 4px 4px 4px 14px;
            margin-top: 10px;
            border: 1px solid #e6ecf5;
            transition: 0.3s;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .input-area:focus-within {
            border-color: #4f7df3;
            box-shadow: 0 2px 12px rgba(79,125,243,0.10);
        }

        .input-left {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .input-left button {
            background: none;
            border: none;
            color: #8a9bb5;
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
        }
        .input-left button:hover {
            background: #e6edf6;
            color: #1a2b4a;
        }
        .input-left button.mic-btn {
            color: #4f7df3;
        }
        .input-left button.mic-btn:hover {
            background: #dfe8fd;
        }

        .input-area input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 4px;
            font-size: 15px;
            outline: none;
            color: #1a2b4a;
            min-width: 0;
            direction: rtl;
        }
        .input-area input::placeholder {
            color: #b0c0d4;
            font-size: 14px;
        }

        .input-area .send-btn {
            background: #4f7df3;
            border: none;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(79,125,243,0.30);
        }
        .input-area .send-btn:hover {
            background: #3b66d9;
            transform: scale(1.02);
        }
        .input-area .send-btn:active {
            transform: scale(0.92);
        }

        /* ===== تحسين للشاشات الصغيرة جداً ===== */
        @media (max-width: 420px) {
            .sidebar { width: 50px; padding: 12px 2px; }
            .sidebar .logo { font-size: 14px; }
            .sidebar .logo i { font-size: 20px; }
            .sidebar .nav-icons a i { font-size: 17px; }
            .sidebar .nav-icons a span { display: none; }
            .sidebar .bottom-icons a { font-size: 16px; }
            .main-chat { padding: 8px 10px; }
            .chat-header h2 { font-size: 15px; }
            .message { font-size: 13px; padding: 8px 12px; }
            .input-area input { font-size: 14px; }
            .input-area .send-btn { width: 38px; height: 38px; font-size: 16px; }
            .input-left button { width: 30px; height: 30px; font-size: 16px; }
        }

        /* إخفاء عناصر مؤقتة غير مستخدمة */
        .hidden-feature { display: none; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- ===== الشريط الجانبي ===== -->
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-brain"></i>
            <span>نيراس</span>
        </div>
        <div class="nav-icons">
            <a href="#" class="active"><i class="fas fa-home"></i><span>الرئيسية</span></a>
            <a href="#"><i class="fas fa-layer-group"></i><span>المكتبة</span></a>
            <a href="#"><i class="fas fa-search"></i><span>بحث</span></a>
            <a href="#"><i class="fas fa-history"></i><span>السابقة</span></a>
        </div>
        <div class="bottom-icons">
            <a href="#"><i class="fas fa-cog"></i></a>
            <a href="#"><i class="fas fa-sign-out-alt"></i></a>
        </div>
    </div>

    <!-- ===== القسم الرئيسي ===== -->
    <div class="main-chat">

        <!-- الهيدر -->
        <div class="chat-header">
            <h2><i class="fas fa-robot"></i> نيراس</h2>
            <div class="header-actions"><i class="fas fa-ellipsis-v"></i></div>
        </div>

        <!-- صندوق المحادثة -->
        <div id="chat-box">
            <!-- تظهر الرسائل هنا -->
        </div>

        <!-- ===== مربع الكتابة المصغر للجوال ===== -->
        <div class="input-area">
            <div class="input-left">
                <button class="mic-btn" id="micBtn" title="إرسال صوتي"><i class="fas fa-microphone"></i></button>
                <button id="fileBtn" title="رفع صورة"><i class="fas fa-image"></i></button>
                <input type="file" id="fileInput" accept="image/*" style="display: none;" />
            </div>
            <input type="text" id="user-input" placeholder="اكتب رسالتك..." autofocus />
            <button class="send-btn" id="sendBtn"><i class="fas fa-arrow-left"></i></button>
        </div>
    </div>
</div>

<script>
    (function() {
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const fileBtn = document.getElementById('fileBtn');
        const fileInput = document.getElementById('fileInput');

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
            msgDiv.innerHTML = `${text} <span class="time">${timeStr}</span>`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            addMessage(message, 'user');
            userInput.value = '';
            userInput.focus();
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                if (res.ok) addMessage(data.response, 'bot');
                else addMessage(`⚠️ ${data.error || 'خطأ'}`, 'bot error-msg');
            } catch (e) {
                addMessage('⚠️ تعذر الاتصال', 'bot error-msg');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        micBtn.addEventListener('click', () => addMessage('🎙️ ميزة الصوت قريباً', 'bot'));
        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                const file = this.files[0];
                addMessage(`📎 رفع: ${file.name}`, 'user');
                fileInput.value = '';
            }
        });

        setTimeout(() => addMessage('👋 مرحباً! أنا نيراس، اسألني عن أي شيء.', 'bot'), 300);
    })();
</script>
</body>
</html>
